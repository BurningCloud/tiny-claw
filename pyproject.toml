[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-claw"
version = "0.1.0"
description = "从零手写的 Agent Harness（go-tiny-claw 的 Python 移植），零第三方依赖"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 刻意保持零依赖：只用标准库，装好 Python 就能跑。
dependencies = []

[project.scripts]
claw = "tiny_claw.apps.claw:main"
bench = "tiny_claw.apps.bench:main"
feishu-bot = "tiny_claw.apps.feishu_bot:main"

[tool.setuptools.packages.find]
include = ["tiny_claw*"]

[tool.setuptools]
# tests 不是发布包的一部分，只用于本地开发验证。
